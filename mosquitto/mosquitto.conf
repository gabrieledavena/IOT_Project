# Broker MQTT di Solar Family: Mosquitto con il plugin mosquitto-go-auth.
# Nessun accesso anonimo: chi si collega e a quali topic può accedere lo decide Django (SP/mqtt_auth.py).

listener 1883
allow_anonymous false

# I messaggi retained (stato e configurazione degli impianti) e le sessioni persistenti sopravvivono ai riavvii
persistence true
persistence_location /var/lib/mosquitto/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

auth_plugin /mosquitto/go-auth.so
auth_opt_backends http
auth_opt_log_level info

# Il broker chiede a Django con una POST JSON e guarda solo lo status della risposta (200 sì, 403 no)
auth_opt_http_host django-server
auth_opt_http_port 8000
auth_opt_http_getuser_uri /sp/mqtt/auth/user/
auth_opt_http_superuser_uri /sp/mqtt/auth/superuser/
auth_opt_http_aclcheck_uri /sp/mqtt/auth/acl/
auth_opt_http_params_mode json
auth_opt_http_response_mode status
auth_opt_http_timeout 5

# Nessuna cache: Django controlla ogni connessione e ogni messaggio, così un dispositivo disinstallato o con
# nuove credenziali viene fermato subito. (La cache del plugin, inoltre, ricorderebbe l'esito del login per
# username e password senza il client id, che Django invece controlla.)
auth_opt_cache false
